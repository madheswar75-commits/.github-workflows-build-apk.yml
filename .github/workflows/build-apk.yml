name: Build MeshLink APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Extract MeshLink ZIP
        run: |
          unzip -o MeshLink-Complete.zip -d meshlink-project

      - name: Setup Gr
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: meshlink-project/MeshLink
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-debug-apk
          path: meshlink-project/MeshLink/app/build/outputs/apk/debug/*.apk

          
